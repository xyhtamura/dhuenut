<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">DHuenut icon</title>
  <desc id="desc">A glowing cosmic candy torus with a rainbow glaze curve.</desc>
  <defs>
    <radialGradient id="space" cx="32%" cy="22%" r="76%">
      <stop offset="0" stop-color="#ffbde4"/>
      <stop offset="0.36" stop-color="#47235f"/>
      <stop offset="1" stop-color="#150a21"/>
    </radialGradient>
    <linearGradient id="shell" x1="10" y1="16" x2="55" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3bf"/>
      <stop offset="0.24" stop-color="#ffc85f"/>
      <stop offset="0.5" stop-color="#ff65b8"/>
      <stop offset="0.74" stop-color="#8fa1ff"/>
      <stop offset="1" stop-color="#44e4d2"/>
    </linearGradient>
    <linearGradient id="glaze" x1="11" y1="29" x2="54" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44e4d2"/>
      <stop offset="0.32" stop-color="#d8fb59"/>
      <stop offset="0.62" stop-color="#ffc85f"/>
      <stop offset="1" stop-color="#ff65b8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="torusHole">
      <rect width="64" height="64" fill="#fff"/>
      <ellipse cx="32" cy="32" rx="13.5" ry="7.7" fill="#000"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#space)"/>
  <g transform="rotate(-16 32 32)" filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="26" ry="15.2" fill="url(#shell)" mask="url(#torusHole)"/>
    <ellipse cx="32" cy="32" rx="13.5" ry="7.7" fill="#13091e" stroke="#fff3bf" stroke-width="2.4"/>
    <path d="M8.8 31.7c6.7-7.8 16.1-8.5 24.3-2.4 8.7 6.5 14.7 5.4 22.6-2.3" fill="none" stroke="#3d1748" stroke-width="7" stroke-linecap="round"/>
    <path d="M8.8 31.7c6.7-7.8 16.1-8.5 24.3-2.4 8.7 6.5 14.7 5.4 22.6-2.3" fill="none" stroke="url(#glaze)" stroke-width="4.2" stroke-linecap="round"/>
  </g>
  <circle cx="17" cy="16" r="1.8" fill="#fff3bf"/>
  <circle cx="49" cy="16" r="1.5" fill="#44e4d2"/>
  <circle cx="49" cy="48" r="2" fill="#d8fb59"/>
  <circle cx="13" cy="45" r="1.3" fill="#ff65b8"/>
</svg>
