<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">DHuenut icon</title>
  <desc id="desc">A highly saturated transparent glass rainbow donut with a glossy sheen.</desc>
  <defs>
    <!-- Rainbow Body: Highly saturated semi-transparent gradient -->
    <linearGradient id="rainbow-body" x1="10" y1="16" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ff9f00" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8fff00" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a200ff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Rainbow Stroke: Fully opaque, neon-saturated matching colors -->
    <linearGradient id="rainbow-stroke" x1="10" y1="16" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3377"/>
      <stop offset="25%" stop-color="#ffb233"/>
      <stop offset="50%" stop-color="#a6ff33"/>
      <stop offset="75%" stop-color="#33f2ff"/>
      <stop offset="100%" stop-color="#b533ff"/>
    </linearGradient>

    <!-- Glass Sheen: Soft white reflections for depth -->
    <linearGradient id="glass-sheen" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-16 32 32)">
    <!-- Torus Glass Body with Rainbow Filling (EvenOdd path handles the hole transparency) -->
    <path d="M 6,32 A 26,15.2 0 1,0 58,32 A 26,15.2 0 1,0 6,32 M 18.5,32 A 13.5,7.7 0 1,1 45.5,32 A 13.5,7.7 0 1,1 18.5,32" fill="url(#rainbow-body)" fill-rule="evenodd"/>
    
    <!-- Torus Glass Sheen Layer -->
    <path d="M 6,32 A 26,15.2 0 1,0 58,32 A 26,15.2 0 1,0 6,32 M 18.5,32 A 13.5,7.7 0 1,1 45.5,32 A 13.5,7.7 0 1,1 18.5,32" fill="url(#glass-sheen)" fill-rule="evenodd"/>

    <!-- Sharp Rainbow Borders -->
    <!-- Outer boundary stroke -->
    <ellipse cx="32" cy="32" rx="26" ry="15.2" fill="none" stroke="url(#rainbow-stroke)" stroke-width="3"/>
    <!-- Inner hole boundary stroke -->
    <ellipse cx="32" cy="32" rx="13.5" ry="7.7" fill="none" stroke="url(#rainbow-stroke)" stroke-width="2.5"/>

    <!-- Glass Reflections & Highlights -->
    <!-- Top outer rim gloss arc -->
    <path d="M 12,26 C 18,16 46,16 52,26" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <!-- Bottom inner rim gloss arc -->
    <path d="M 23,35 C 27,37 37,37 41,35" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <!-- Intense specular reflection bubble -->
    <ellipse cx="20" cy="22" rx="2.5" ry="1.2" fill="#ffffff" opacity="0.9" transform="rotate(-15 20 22)"/>
  </g>

  <!-- Floating Sprinkles / Stars -->
  <circle cx="17" cy="16" r="2" fill="#fff3bf" opacity="0.9"/>
  <circle cx="49" cy="16" r="1.8" fill="#33f2ff" opacity="0.9"/>
  <circle cx="49" cy="48" r="2.2" fill="#a6ff33" opacity="0.9"/>
  <circle cx="13" cy="45" r="1.5" fill="#ff3377" opacity="0.9"/>
</svg>
